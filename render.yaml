# Render Blueprint Specification for MERCHANT ZONE
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: merchant-zone
    runtime: node
    plan: starter # Note: Persistent Disks require Starter plan or above ($7/mo + $0.25/GB disk)
    region: oregon # Available: oregon, ohio, frankfurt, singapore
    buildCommand: npm install && npm run build
    startCommand: npm run start
    autoDeploy: true

    # Persistent Storage Configuration
    # Guarantees that SQLite orders, settings, custom QR codes, and customer uploaded proofs persist across redeploys
    disk:
      name: merchant-zone-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/merchant_zone.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: MAX_FILE_SIZE
        value: "5242880"
      - key: SESSION_SECRET
        generateValue: true # Render automatically generates a secure 32+ character string
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_INITIAL_PASSWORD
        sync: false # Set securely in the Render Dashboard
      - key: NEXT_PUBLIC_BASE_URL
        sync: false # Set to your Render URL, e.g. https://merchant-zone.onrender.com
